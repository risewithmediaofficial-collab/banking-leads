server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ─── PRIORITY 1: Proxy /uploads/ to backend (must come BEFORE static asset regex) ───
    location ^~ /uploads/ {
        proxy_pass         http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_buffering    off;
        proxy_read_timeout 60s;
        add_header         Access-Control-Allow-Origin *;
    }

    # ─── PRIORITY 2: Proxy /generated/ Excel reports to backend ───
    location ^~ /generated/ {
        proxy_pass         http://backend:3000/generated/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header         Access-Control-Allow-Origin *;
    }

    # ─── PRIORITY 3: Proxy all /api/ requests to backend ───
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # ─── PRIORITY 4: Cache only JS/CSS static bundle assets ───
    # NOTE: Do NOT include png/jpg/jpeg here — images come from backend via /uploads/
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ─── PRIORITY 5: SPA Fallback (React Router) ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

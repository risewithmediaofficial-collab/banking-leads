version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:latest
    container_name: banking_leads_db
    restart: always
    ports:
      - "27023:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - banking_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking_leads_backend
    restart: always
    ports:
      - "5007:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/banking-leads
      - NODE_ENV=production
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated:/app/generated
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - banking_network

  # React + Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking_leads_frontend
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - backend
    networks:
      - banking_network

networks:
  banking_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local
  backend_generated:
    driver: local
